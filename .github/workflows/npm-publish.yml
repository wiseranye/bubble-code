name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [[ "$VERSION" == *-beta* ]]; then
            TAG="beta"
          elif [[ "$VERSION" == *-rc* ]]; then
            TAG="rc"
          else
            TAG="latest"
          fi

          echo "Publishing version $VERSION with tag $TAG"
          npm publish --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
